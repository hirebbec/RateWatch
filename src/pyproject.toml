[project]
name = "src"
version = "0.1.0"
description = ""
authors = []
requires-python = ">=3.13,<3.15"
package-mode = false

dependencies = [
    "fastapi[all] (>=0.136.3,<0.137.0)",
    "prefect (>=3.7.2,<4.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "boto3-stubs (>=1.43.25,<2.0.0)",
    "botocore-stubs (>=1.43.14,<2.0.0)"
]

[tool.ruff]
target-version = "py312"
line-length = 120


[tool.ruff.lint]
extend-select = ["I"]


[tool.mypy]
allow_redefinition = "False"
check_untyped_defs = "True"
disallow_untyped_decorators = "True"
disallow_any_explicit = "False"
disallow_any_generics = "True"
disallow_untyped_calls = "True"
ignore_errors = "False"
ignore_missing_imports = "True"
implicit_reexport = "False"
local_partial_types = "True"
strict_optional = "True"
strict_equality = "True"
no_implicit_optional = "True"
warn_unused_ignores = "True"
warn_redundant_casts = "True"
warn_unused_configs = "True"
warn_unreachable = "True"
warn_no_return = "True"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.14,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)"
]
